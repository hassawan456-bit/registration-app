name: CI/CD Pipeline

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

jobs:
  ci:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: "npm"

      - name: Install root dependencies
        run: npm ci

      - name: Install server dependencies
        run: npm ci --prefix server

      - name: Install client dependencies
        run: npm ci --prefix client

      - name: Test (Backend API)
        run: npm test

      - name: Build Frontend
        run: npm run build --prefix client

  cd:
    name: Deploy (Localhost)
    needs: ci
    runs-on: self-hosted
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main')

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: "npm"

      - name: Install server dependencies
        shell: powershell
        run: npm ci --prefix server

      - name: Install client dependencies
        shell: powershell
        run: npm ci --prefix client

      - name: Build frontend
        shell: powershell
        run: npm run build --prefix client

      - name: Deploy with PM2
        shell: powershell
        run: |
          npx pm2 restart registration-app --update-env
          if (-not $?) { npx pm2 start server/server.js --name registration-app }
          npx pm2 save
