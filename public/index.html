<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Registration Form</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
    }

    .container {
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 20px;
      padding: 40px;
      width: 480px;
      color: #fff;
      box-shadow: 0 25px 50px rgba(0, 0, 0, 0.4);
    }

    .container h1 {
      text-align: center;
      margin-bottom: 8px;
      font-size: 28px;
      background: linear-gradient(90deg, #f7971e, #ffd200);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .container p.subtitle {
      text-align: center;
      color: rgba(255, 255, 255, 0.5);
      margin-bottom: 30px;
      font-size: 14px;
    }

    .row {
      display: flex;
      gap: 15px;
    }

    .form-group {
      margin-bottom: 18px;
      flex: 1;
    }

    .form-group label {
      display: block;
      margin-bottom: 6px;
      font-size: 13px;
      color: rgba(255, 255, 255, 0.7);
      font-weight: 500;
    }

    .form-group input,
    .form-group select {
      width: 100%;
      padding: 12px 16px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.07);
      color: #fff;
      font-size: 14px;
      outline: none;
      transition: border 0.3s, box-shadow 0.3s;
    }

    .form-group input:focus,
    .form-group select:focus {
      border-color: #ffd200;
      box-shadow: 0 0 0 3px rgba(255, 210, 0, 0.15);
    }

    .form-group input::placeholder {
      color: rgba(255, 255, 255, 0.3);
    }

    .form-group select option {
      background: #302b63;
      color: #fff;
    }

    .radio-group {
      display: flex;
      gap: 20px;
      margin-top: 4px;
    }

    .radio-group label {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 14px;
      color: rgba(255, 255, 255, 0.7);
      cursor: pointer;
    }

    .radio-group input[type="radio"] {
      accent-color: #ffd200;
      width: 16px;
      height: 16px;
    }

    .btn {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 10px;
      background: linear-gradient(135deg, #f7971e, #ffd200);
      color: #1a1a2e;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      margin-top: 10px;
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(255, 210, 0, 0.3);
    }

    .btn:active { transform: translateY(0); }

    .message {
      margin-top: 15px;
      padding: 12px;
      border-radius: 10px;
      text-align: center;
      font-size: 14px;
      font-weight: 600;
      display: none;
    }

    .message.success {
      display: block;
      background: rgba(0, 200, 83, 0.15);
      border: 1px solid rgba(0, 200, 83, 0.3);
      color: #69f0ae;
    }

    .message.error {
      display: block;
      background: rgba(255, 82, 82, 0.15);
      border: 1px solid rgba(255, 82, 82, 0.3);
      color: #ff5252;
    }

    .registered-users {
      margin-top: 25px;
      padding-top: 20px;
      border-top: 1px solid rgba(255, 255, 255, 0.1);
    }

    .registered-users h3 {
      font-size: 14px;
      color: rgba(255, 255, 255, 0.5);
      margin-bottom: 10px;
    }

    .user-card {
      background: rgba(255, 255, 255, 0.05);
      border-radius: 10px;
      padding: 12px 16px;
      margin-bottom: 8px;
      font-size: 13px;
      color: rgba(255, 255, 255, 0.8);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .user-card .name { font-weight: 600; color: #ffd200; }
    .no-users { color: rgba(255,255,255,0.3); font-size: 13px; text-align: center; }
  </style>
</head>
<body>
  <div class="container">
    <h1>Create Account</h1>
    <p class="subtitle">Fill in the details to register</p>

    <form id="regForm">
      <div class="row">
        <div class="form-group">
          <label>First Name *</label>
          <input type="text" name="firstName" placeholder="John" required />
        </div>
        <div class="form-group">
          <label>Last Name *</label>
          <input type="text" name="lastName" placeholder="Doe" required />
        </div>
      </div>

      <div class="form-group">
        <label>Email Address *</label>
        <input type="email" name="email" placeholder="john@example.com" required />
      </div>

      <div class="form-group">
        <label>Phone Number</label>
        <input type="tel" name="phone" placeholder="+92 300 1234567" />
      </div>

      <div class="form-group">
        <label>Password *</label>
        <input type="password" name="password" placeholder="Min 6 characters" required minlength="6" />
      </div>

      <div class="form-group">
        <label>Gender</label>
        <div class="radio-group">
          <label><input type="radio" name="gender" value="Male" /> Male</label>
          <label><input type="radio" name="gender" value="Female" /> Female</label>
          <label><input type="radio" name="gender" value="Other" /> Other</label>
        </div>
      </div>

      <div class="row">
        <div class="form-group">
          <label>Date of Birth</label>
          <input type="date" name="dob" />
        </div>
        <div class="form-group">
          <label>City</label>
          <select name="city">
            <option value="">Select City</option>
            <option value="Karachi">Karachi</option>
            <option value="Lahore">Lahore</option>
            <option value="Islamabad">Islamabad</option>
            <option value="Rawalpindi">Rawalpindi</option>
            <option value="Faisalabad">Faisalabad</option>
            <option value="Peshawar">Peshawar</option>
            <option value="Quetta">Quetta</option>
            <option value="Multan">Multan</option>
          </select>
        </div>
      </div>

      <button type="submit" class="btn">Register Now</button>
    </form>

    <div id="message" class="message"></div>

    <div class="registered-users">
      <h3>REGISTERED USERS</h3>
      <div id="userList"><p class="no-users">No users registered yet</p></div>
    </div>
  </div>

  <script>
    const form = document.getElementById("regForm");
    const msg = document.getElementById("message");
    const userList = document.getElementById("userList");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const data = Object.fromEntries(new FormData(form));

      try {
        const res = await fetch("/register", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(data),
        });
        const result = await res.json();

        msg.textContent = result.message;
        msg.className = "message " + (result.success ? "success" : "error");

        if (result.success) {
          form.reset();
          loadUsers();
        }
      } catch (err) {
        msg.textContent = "Server error. Try again!";
        msg.className = "message error";
      }
    });

    async function loadUsers() {
      const res = await fetch("/users");
      const users = await res.json();
      if (users.length === 0) {
        userList.innerHTML = '<p class="no-users">No users registered yet</p>';
        return;
      }
      userList.innerHTML = users
        .map(
          (u) => `
        <div class="user-card">
          <span><span class="name">${u.firstName} ${u.lastName}</span> &mdash; ${u.email}</span>
          <span>${u.city || "N/A"}</span>
        </div>`
        )
        .join("");
    }

    loadUsers();
  </script>
</body>
</html>
